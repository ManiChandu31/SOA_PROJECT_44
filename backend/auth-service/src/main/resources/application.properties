server.port=8081
spring.application.name=auth-service

# Database Configuration
# Default to H2 for local development so the service can boot without a MySQL password.
# To use MySQL locally, set DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER_CLASS_NAME and optionally HIBERNATE_DIALECT.
spring.datasource.url=${DB_URL:jdbc:h2:mem:talentsync_auth_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# JWT Secret & Expiration
# Local fallback only. Set JWT_SECRET in STS or deployment environments to override it.
jwt.secret=${JWT_SECRET:talentsync-local-development-secret-change-before-production-2026}
jwt.expiration=86400000
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0
