server.port=8082
spring.application.name=job-service

# Database Configuration
# Default to H2 for local development so the service can boot without a MySQL password.
# To use MySQL locally, set DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER_CLASS_NAME and optionally HIBERNATE_DIALECT.
spring.datasource.url=${DB_URL:jdbc:h2:mem:talentsync_job_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# Eureka Client
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Expose the endpoints used by Eureka's instance links.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0

# JWT Secret for token validation. Set JWT_SECRET in the environment.
jwt.secret=${JWT_SECRET}
