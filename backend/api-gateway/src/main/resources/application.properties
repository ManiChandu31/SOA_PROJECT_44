server.port=${SERVER_PORT:8080}
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[1].id=job-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://job-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/jobs/**
spring.cloud.gateway.server.webflux.routes[2].id=application-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://application-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/applications/**
spring.cloud.gateway.server.webflux.routes[3].id=recruitment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://recruitment-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/recruitment/**
jwt.secret=${JWT_SECRET}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0
